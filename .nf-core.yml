repository_type: pipeline

nf_core_version: 3.6.0.dev0

lint:
  # This pipeline is published under the ebi-metagenomics org, so the boilerplate files
  # that carry the pipeline's identity necessarily diverge from the nf-core template.
  files_unchanged:
    - .github/CONTRIBUTING.md
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/PULL_REQUEST_TEMPLATE.md
    - assets/email_template.html
    - assets/email_template.txt
    - assets/sendmail_template.txt
    - docs/README.md
    - .gitignore
  # The MultiQC report links to our own docs on GitHub rather than an nf-co.re pipeline page.
  multiqc_config:
    - report_comment

template:
  org: ebi-metagenomics
  name: subspeciesprofiler
  description: Pipeline that generates subspecies clusters from a group of genomes
    of the same species
  author: Alejandra Escobar
  version: 1.0.0dev
  force: true
  outdir: .
  is_nfcore: false
