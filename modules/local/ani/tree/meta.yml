name: "ani_tree"
description: |
  Neighbour-joining tree (Newick) of one species from its all-vs-all FastANI, with
  bin/fastani_to_tree.py: distance = 1 - ANI/100, averaged over both directions.
keywords:
  - ani
  - fastani
  - phylogeny
  - neighbour joining
  - newick
tools:
  - "biopython":
      description: "Biopython: tools for computational molecular biology; Bio.Phylo builds the neighbour-joining tree."
      homepage: "https://biopython.org/"
      documentation: "https://biopython.org/docs/latest/api/Bio.Phylo.TreeConstruction.html"
      doi: "10.1093/bioinformatics/btp163"
      licence: ["BSD-3-Clause"]
      identifier: "biotools:biopython"

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing species information, e.g. `[ id:'Bifidobacterium_longum' ]`
    - ani:
        type: file
        description: |
          All-vs-all FastANI output of the species (query, reference, percent ANI, matched and
          total fragments). Every genome pair must be present.
        pattern: "*.txt"
        ontologies: []

output:
  tree:
    - - meta:
          type: map
          description: Groovy Map containing species information
      - "*_ani_nj_tree.nwk":
          type: file
          description: Neighbour-joining tree in Newick format; tips are the genome sample names.
          pattern: "*_ani_nj_tree.nwk"
          ontologies: []
  versions_python:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "python":
          type: string
          description: The name of the tool
      - "python --version | sed 's/Python //'":
          type: eval
          description: The expression to obtain the version of the tool
  versions_biopython:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "biopython":
          type: string
          description: The name of the tool
      - "python -c 'import Bio; print(Bio.__version__)'":
          type: eval
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - python:
          type: string
          description: The name of the tool
      - python --version | sed 's/Python //':
          type: eval
          description: The expression to obtain the version of the tool
    - - ${task.process}:
          type: string
          description: The name of the process
      - biopython:
          type: string
          description: The name of the tool
      - python -c 'import Bio; print(Bio.__version__)':
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@Ales-ibt"
maintainers:
  - "@Ales-ibt"
