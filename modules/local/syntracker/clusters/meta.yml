name: "syntracker_clusters"
description: |
  Turns SynTracker APSS into de novo subspecies clusters with bin/syntracker_apss_clusters.py,
  following the SynTracker paper's network analysis: one subsampling depth (chosen at the
  retention cliff with `--depth auto`), an APSS-weighted graph of the targets pruned at
  `min_apss`, and Leiden communities (modularity), one `Taxon,Cluster` table per
  (min_apss, resolution). The tables have the format of PopPUNK `*_clusters.csv`, so they are
  scored by poppunk/evaluate like any PopPUNK fit.
keywords:
  - syntracker
  - apss
  - clustering
  - subspecies
tools:
  - "python":
      description: "Runs bin/syntracker_apss_clusters.py (pandas, python-igraph, matplotlib)."
      homepage: "https://www.python.org/"
      documentation: "https://pandas.pydata.org/docs/"
      licence: ["PSF-2.0"]
      identifier: ""

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing species information, e.g. `[ id:'Bifidobacterium_longum' ]`
    - apss:
        type: file
        description: |
          SynTracker `avg_synteny_scores_<n|all>_regions.csv` table(s) from one run: every per-n
          table for `--depth auto`, or the single table of a fixed depth.
        pattern: "avg_synteny_scores_*_regions.csv"
        ontologies: []
    - targets:
        type: file
        description: SynTracker target sample names, one per line; every target is a graph node.
        pattern: "*.txt"
        ontologies: []

output:
  clusters:
    - - meta:
          type: map
          description: Groovy Map containing species information
      - "*_syntracker_*_clusters.csv":
          type: file
          description: |
            One `Taxon,Cluster` table per (min_apss, resolution), named
            `<prefix>_syntracker_leiden_n<n>_apss<t>_r<res>_clusters.csv`; cluster 1 is the largest.
          pattern: "*_syntracker_*_clusters.csv"
          ontologies: []
  qc:
    - - meta:
          type: map
          description: Groovy Map containing species information
      - "*_syntracker_*_cluster_qc.tsv":
          type: file
          description: |
            Per-cluster QC for each table: size, mean intra-cluster APSS, max inter-cluster APSS,
            low_confidence (size <= 2), reference genome and depth.
          pattern: "*_syntracker_*_cluster_qc.tsv"
          ontologies: []
  retention:
    - - meta:
          type: map
          description: Groovy Map containing species information
      - "*_syntracker_depth_retention.{tsv,png}":
          type: file
          description: |
            Retained targets and pairs per subsampling depth, with the chosen depth (TSV and
            plot). Only written with `--depth auto`.
          pattern: "*_syntracker_depth_retention.{tsv,png}"
          ontologies: []
  versions_python:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "python":
          type: string
          description: The name of the tool
      - "python --version | sed 's/Python //'":
          type: eval
          description: The expression to obtain the version of the tool
  versions_igraph:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "python-igraph":
          type: string
          description: The name of the tool
      - "python -c 'import igraph; print(igraph.__version__)'":
          type: eval
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - python:
          type: string
          description: The name of the tool
      - python --version | sed 's/Python //':
          type: eval
          description: The expression to obtain the version of the tool
    - - ${task.process}:
          type: string
          description: The name of the process
      - python-igraph:
          type: string
          description: The name of the tool
      - python -c 'import igraph; print(igraph.__version__)':
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@Ales-ibt"
maintainers:
  - "@Ales-ibt"
