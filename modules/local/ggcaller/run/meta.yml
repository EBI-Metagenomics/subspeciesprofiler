name: "ggcaller"
description: |
  Calls genes in all the genomes of one species at once with ggCaller (on a Bifrost de Bruijn
  graph, so gene calls are consistent across fragmented assemblies). Writes one GFF3 per genome
  (with the FASTA, ready for Panaroo) and the protein and nucleotide gene calls. Genomes are
  renamed from ggCaller's file-name stems to the r-file sample names.
keywords:
  - ggcaller
  - gene calling
  - pangenome
  - gff
tools:
  - "ggcaller":
      description: "ggCaller: a gene caller for Bifrost graphs, for consistent gene calls across a collection of genomes."
      homepage: "https://github.com/bacpop/ggCaller"
      documentation: "https://ggcaller.readthedocs.io/"
      tool_dev_url: "https://github.com/bacpop/ggCaller"
      doi: "10.1101/gr.277733.123"
      licence: ["MIT"]
      identifier: ""

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing species information, e.g. `[ id:'Streptococcus_pneumoniae' ]`
    - genomes:
        type: file
        description: The genome FASTA files of the r-file (optionally gzipped), staged under genomes/.
        pattern: "*.{fasta,fa,fna}{,.gz}"
        ontologies: []
    - rfile:
        type: file
        description: SPECIESQC r-file (`sample<TAB>./genomes/<file>`, no header); one row per genome.
        pattern: "*.tsv"
        ontologies: []
  - db:
      type: directory
      description: ggCaller database directory, as written by ggcaller/downloaddb.
      pattern: "*"

output:
  gff:
    - - meta:
          type: map
          description: Groovy Map containing species information
      - "gff/*.gff.gz":
          type: file
          description: One gzipped GFF3 per genome, named `<sample>.gff.gz`, with the genome FASTA appended.
          pattern: "gff/*.gff.gz"
          ontologies: []
  proteins:
    - - meta:
          type: map
          description: Groovy Map containing species information
      - "faa/*.faa.gz":
          type: file
          description: Gzipped protein sequences of the gene calls, one file per genome (`<sample>.faa.gz`), headers `<sample>_<ORF id>`.
          pattern: "faa/*.faa.gz"
          ontologies: []
  genes:
    - - meta:
          type: map
          description: Groovy Map containing species information
      - "ffn/*.ffn.gz":
          type: file
          description: Gzipped nucleotide CDS sequences of the gene calls, one file per genome (`<sample>.ffn.gz`), headers `<sample>_<ORF id>`.
          pattern: "ffn/*.ffn.gz"
          ontologies: []
  versions_ggcaller:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "ggcaller":
          type: string
          description: The name of the tool
      - "ggcaller --version | sed 's/^ggcaller //'":
          type: eval
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - ggcaller:
          type: string
          description: The name of the tool
      - ggcaller --version | sed 's/^ggcaller //':
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@Ales-ibt"
maintainers:
  - "@Ales-ibt"
