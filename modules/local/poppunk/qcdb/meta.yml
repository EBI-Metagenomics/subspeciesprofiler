name: "poppunk_qcdb"
description: |
  Runs quality control on an existing PopPUNK database built by
  `poppunk --create-db`. `poppunk --qc-db` prunes and/or flags outlier
  samples (e.g. by maximum accessory/core distance, random-match distance,
  genome length, or ambiguous base content), producing a cleaned database
  used as input for downstream model fitting. Second step of the
  subspecies clustering workflow (createdb -> qcdb -> fitmodel).
keywords:
  - poppunk
  - quality control
  - qc
  - clustering
  - population genomics
  - database
  - pruning
  - bacterial genomics
  - subspecies
tools:
  - "poppunk":
      description: "PopPUNK (POPulation Partitioning Using Nucleotide Kmers)"
      homepage: "https://poppunk.bacpop.org/index.html"
      documentation: "https://poppunk.bacpop.org/index.html"
      tool_dev_url: "https://github.com/bacpop/PopPUNK"
      doi: "10.1101/gr.241455.118"
      licence: ["Apache-2.0"]
      identifier: biotools:poppunk

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - db:
        type: directory
        description: |
          Mandatory. PopPUNK database directory generated by
          `poppunk --create-db` (e.g. by POPPUNK_CREATEDB). Contains the
          sketch database (`<name>.h5`) and the pairwise core/accessory
          distance matrices (`<name>.dists.npy`, `<name>.dists.pkl`), plus
          other PopPUNK database files. Passed to `poppunk --qc-db --ref-db`.
        pattern: "*"
        ontologies: []

output:
  qc_db:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - ${qc_prefix}:
          type: directory
          description: |
            Mandatory. QC'd/pruned PopPUNK database directory generated by
            `poppunk --qc-db`. Contains the cleaned sketch database
            (`<prefix>_qc.h5`) and distance matrices
            (`<prefix>_qc.dists.npy`, `<prefix>_qc.dists.pkl`), the QC
            report (`<prefix>_qc_qcreport.txt`), and optional QC plots
            (`.png`).
          pattern: "${qc_prefix}"
          ontologies: []
  versions_poppunk:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "poppunk":
          type: string
          description: The name of the tool
      - "poppunk --version":
          type: eval
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - poppunk:
          type: string
          description: The name of the tool
      - poppunk --version:
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@Ales-ibt"
maintainers:
  - "@Ales-ibt"
