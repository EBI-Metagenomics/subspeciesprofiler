name: "poppunk_createdb"
description: |
  Builds a PopPUNK database from a set of assembled genomes belonging to the
  same species. PopPUNK sketches each assembly (using k-mer based genome
  sketching) and calculates pairwise core and accessory genome distances
  between all samples, producing the database used as input for downstream
  model fitting and subspecies cluster assignment.
keywords:
  - poppunk
  - clustering
  - population genomics
  - k-mer
  - sketch
  - database
  - distances
  - bacterial genomics
  - subspecies
tools:
  - "poppunk":
      description: "PopPUNK (POPulation Partitioning Using Nucleotide Kmers)"
      homepage: "https://poppunk.bacpop.org/index.html"
      documentation: "https://poppunk.bacpop.org/index.html"
      tool_dev_url: "https://github.com/bacpop/PopPUNK"
      doi: "10.1101/gr.241455.118"
      licence: ["Apache-2.0"]
      identifier: biotools:poppunk

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - genomes:
        type: file
        description: |
          Mandatory. The HQ/MQ assembly FASTA files (one per genome), staged into
          a `genomes/` directory so the r-file's relative `./genomes/<file>` paths
          resolve.
        pattern: "*.{fasta,fa,fna}"
        ontologies:
          - edam: "http://edamontology.org/format_1929" # FASTA
    - rfile:
        type: file
        description: |
          Mandatory. The PopPUNK r-file produced by the speciesqc module:
          no header, tab-separated, `<sample name>\t./genomes/<file>`, listing the
          HQ/MQ genomes. Passed to `poppunk --create-db --r-files`.
        pattern: "*.tsv"
        ontologies:
          - edam: "http://edamontology.org/format_3475" # TSV

output:
  db:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - ${prefix}:
          type: directory
          description: |
            Mandatory. PopPUNK database directory generated by
            `poppunk --create-db`. Contains the sketch database
            (`<prefix>.h5`) and the pairwise core/accessory distance matrices
            (`<prefix>.dists.npy`, `<prefix>.dists.pkl`), plus other PopPUNK
            database files.
          pattern: "${prefix}"
          ontologies: []
  versions_poppunk:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "poppunk":
          type: string
          description: The name of the tool
      - "poppunk --version":
          type: eval
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - poppunk:
          type: string
          description: The name of the tool
      - poppunk --version:
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@Ales-ibt"
maintainers:
  - "@Ales-ibt"
