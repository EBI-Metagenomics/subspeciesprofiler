name: "poppunk_fitmodel"
description: |
  Fits a clustering model (default `bgmm`; also `dbscan`, `refine`,
  `threshold`, or `lineage`) to a PopPUNK database using
  `poppunk --fit-model`, assigning each sample to a cluster and producing
  the fitted model plus cluster assignments used for subspecies
  delineation. Final step of the subspecies clustering workflow
  (createdb -> qcdb -> fitmodel).
keywords:
  - poppunk
  - model fitting
  - clustering
  - bgmm
  - population genomics
  - subspecies
  - bacterial genomics
  - lineage
tools:
  - "poppunk":
      description: "PopPUNK (POPulation Partitioning Using Nucleotide Kmers)"
      homepage: "https://poppunk.bacpop.org/index.html"
      documentation: "https://poppunk.bacpop.org/index.html"
      tool_dev_url: "https://github.com/bacpop/PopPUNK"
      doi: "10.1101/gr.241455.118"
      licence: ["Apache-2.0"]
      identifier: biotools:poppunk

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - db:
        type: directory
        description: |
          Mandatory. PopPUNK database directory, generated by
          `poppunk --create-db` (POPPUNK_CREATEDB) or `poppunk --qc-db`
          (POPPUNK_QCDB). Contains the sketch database (`<name>.h5`) and
          the pairwise core/accessory distance matrices
          (`<name>.dists.npy`, `<name>.dists.pkl`), plus other PopPUNK
          database files. Passed to `poppunk --fit-model --ref-db`.
        pattern: "*"
        ontologies: []
    - fit_args:
        type: string
        description: |
          Mandatory. The model type and its parameters for this task, passed to
          `poppunk --fit-model`, e.g. `bgmm --K 4`, `dbscan --D 5 --min-cluster-prop 0.01`,
          `refine --model-dir <dir>`, `threshold --threshold 0.0012`, or
          `lineage --ranks 1,2,3`. Supplied per task so one module covers the whole
          model sweep; `task.ext.args` may add any common flags.

output:
  model:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - ${fit_prefix}:
          type: directory
          description: |
            Mandatory. Model-fit output directory generated by
            `poppunk --fit-model`. Contains the fitted model
            (`<prefix>_fitmodel_fit.npz`, `<prefix>_fitmodel_fit.pkl`),
            model diagnostic plots (`<prefix>_fitmodel_DPGMM_fit.png`,
            `<prefix>_fitmodel_DPGMM_fit_contours.pdf`), the network graph
            (`<prefix>_fitmodel_graph.gt`), cluster assignments
            (`<prefix>_fitmodel_clusters.csv`,
            `<prefix>_fitmodel_unword_clusters.csv`), and the reference
            sample list plus its associated graph/distance files
            (`<prefix>_fitmodel.refs`,
            `<prefix>_fitmodel.refs_graph.gt`,
            `<prefix>_fitmodel.refs.dists.npy`,
            `<prefix>_fitmodel.refs.dists.pkl`,
            `<prefix>_fitmodel.refs.h5`).
          pattern: "${fit_prefix}"
          ontologies: []
  versions_poppunk:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "poppunk":
          type: string
          description: The name of the tool
      - "poppunk --version":
          type: eval
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - poppunk:
          type: string
          description: The name of the tool
      - poppunk --version:
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@Ales-ibt"
maintainers:
  - "@Ales-ibt"
